<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SERA accessories</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Jost:wght@400;500&display=swap">
<style id="css">
/* Layout: pink brand hero with the logo, then a filterable product grid; owner-only edit tools appear on top for whoever can publish this page. */
:root{
  --bg:#FFF7F6; --surface:#FFFFFF; --ink:#3A2A2C; --muted:#7A6465; --line:#F0D5D6;
  --brand:#F3BBBC; --on-brand:#4A2A2D; --gold:#8A5A2B;
  --btn-bg:#3A2A2C; --btn-fg:#FFF7F6; --danger:#B3261E; --soft:#FBE6E6;
  --font-ar:'Cairo','Jost',system-ui,sans-serif; --font-num:'Jost','Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231819; --surface:#2E2022; --ink:#F8E9E9; --muted:#C9AEB0; --line:#4A3436; --gold:#E2C27E;
  --btn-bg:#F3BBBC; --btn-fg:#2A1A1B; --danger:#FF8A80; --soft:#3A2729; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231819; --surface:#2E2022; --ink:#F8E9E9; --muted:#C9AEB0; --line:#4A3436; --gold:#E2C27E;
  --btn-bg:#F3BBBC; --btn-fg:#2A1A1B; --danger:#FF8A80; --soft:#3A2729; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ar);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
.shell{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1080px;margin-inline:auto;padding-inline:16px}
.hero{background:var(--brand);color:var(--on-brand);text-align:center;padding-block:28px 36px}
.hero svg{display:block;width:min(78vw,360px);height:auto;margin:0 auto}
.hero p{margin:6px auto 20px;font-size:1.125rem;font-weight:600;max-width:30ch;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border:0;border-radius:8px;background:var(--btn-bg);color:var(--btn-fg);font:600 1rem var(--font-ar);text-decoration:none;cursor:pointer}
.btn.off{background:var(--line);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.small{min-height:36px;padding:4px 14px;font-size:.875rem}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.section{padding-block:28px 12px}
.section h2{margin:0 0 14px;font-size:1.5rem;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{min-height:40px;padding:4px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9375rem var(--font-ar);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:20px 16px;padding:0;margin:0;list-style:none}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.media{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--soft)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#F3BBBC,#E9A2A7);font:500 1.5rem var(--font-num);letter-spacing:.3em}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--surface);color:var(--ink);font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px}
.tag.sold{background:var(--ink);color:var(--bg)}
.name{margin:0;font-size:1rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.price{margin:0;font:500 1.0625rem var(--font-num);color:var(--gold);font-variant-numeric:tabular-nums}
.price span{font-family:var(--font-ar);font-size:.875rem}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:10px}
footer{margin-top:auto;padding-block:28px 96px;color:var(--muted);font-size:.9375rem}
footer .wrap{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
footer a{color:var(--ink)}
.num{direction:ltr;unicode-bidi:isolate;font-family:var(--font-num);user-select:all}
.editbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);padding-block:10px}
.editbar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.editbar .btn{background:var(--bg);color:var(--ink)}
.editbar .btn.primary{background:var(--brand);color:#3A2A2C}
.editbar .btn[disabled]{opacity:.45;cursor:default}
.editbar .status{flex:1 1 140px;font-size:.875rem;min-width:0}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 18px rgba(58,42,44,.28)}
.notice{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.9375rem}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,18,19,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,520px);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 14px;font-size:1.25rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-weight:600;font-size:.9375rem}
.field small{color:var(--muted)}
input[type=text],input[type=number],input[type=tel],input[type=file]{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 1rem var(--font-ar)}
.check{display:flex;gap:10px;align-items:center;margin-bottom:14px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.preview{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:.875rem;min-height:1.2em;margin:0 0 10px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background-color .15s,color .15s}}
</style>

  } else {
    var ul = el('ul', {class: 'grid'});
    list.forEach(function(p, i){ ul.append(card(p, i)); });
    sec.append(ul);
  }
  return sec;
}
function footer(){
  var s = state.settings;
  var w = el('div', {class: 'wrap'}, el('strong', {text: 'SERA accessories'}));
  if (s.whatsapp) w.append(el('span', {}, 'واتساب: ', el('span', {class: 'num', text: '+' + s.whatsapp})));
  if (s.instagram) w.append(el('span', {}, 'إنستجرام: ', el('a', {href: 'https://instagram.com/' + encodeURIComponent(s.instagram), target: '_blank', rel: 'noopener', text: '@' + s.instagram})));
  return el('footer', {}, w);
}
function render(){
  app.textContent = '';
  var shell = el('div', {class: 'shell'});
  if (canEdit && editing) shell.append(editbar());
  shell.append(hero(), products(), footer());
  app.append(shell);
  if (canEdit && !editing){
    app.append(el('button', {class: 'btn fab', type: 'button', text: 'تعديل المتجر', onclick: function(){ editing = true; statusMsg = ''; render(); }}));
  }
}

/* ---------- dialogs ---------- */
function openSheet(title, body, buttons){
  var prevFocus = document.activeElement;
  var ov = el('div', {class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, dir: 'rtl', lang: 'ar'});
  var sheet = el('div', {class: 'sheet'}, el('h3', {text: title}), body, el('div', {class: 'row'}, buttons));
  ov.append(sheet);
  function close(){ ov.remove(); document.removeEventListener('keydown', onKey); if (prevFocus && prevFocus.focus) try{ prevFocus.focus(); }catch(e){} }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
  document.body.append(ov);
  var first = sheet.querySelector('input'); if (first) first.focus();
  return close;
}
function field(id, label, input, hint){
  return el('div', {class: 'field'}, el('label', {for: id, text: label}), input, hint ? el('small', {text: hint}) : null);
}
function resizeImage(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onerror = function(){ reject(new Error('read')); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('decode')); };
      img.onload = function(){
        var max = 900, r = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function productForm(p){
  var isNew = !p;
  var draft = p ? {name: p.name, price: p.price, cat: p.cat, img: p.img, soldOut: p.soldOut} : {name: '', price: '', cat: filter || '', img: '', soldOut: false};
  var err = el('p', {class: 'err', role: 'alert'});
  var name = el('input', {type: 'text', id: 'f-name', value: draft.name, autocomplete: 'off'});
  var price = el('input', {type: 'number', id: 'f-price', inputmode: 'numeric', min: '0', value: draft.price});
  var cat = el('input', {type: 'text', id: 'f-cat', value: draft.cat, list: 'f-cats', autocomplete: 'off'});
  var dl = el('datalist', {id: 'f-cats'}); cats().forEach(function(c){ dl.append(el('option', {value: c})); });
  var file = el('input', {type: 'file', id: 'f-img', accept: 'image/*'});
  var prevWrap = el('div', {});
  function showPrev(){
    prevWrap.textContent = '';
    if (draft.img){
      prevWrap.append(el('img', {class: 'preview', src: draft.img, alt: 'صورة المنتج'}),
        el('button', {class: 'btn ghost small', type: 'button', text: 'شيلي الصورة', onclick: function(){ draft.img = ''; file.value = ''; showPrev(); }}));
    }
  }
  showPrev();
  file.addEventListener('change', function(){
    var f = file.files && file.files[0]; if (!f) return;
    err.textContent = '';
    resizeImage(f).then(function(d){ draft.img = d; showPrev(); }).catch(function(){ err.textContent = 'مقدرتش أقرأ الصورة دي. جرّبي صورة تانية.'; });
  });
  var sold = el('input', {type: 'checkbox', id: 'f-sold'}); sold.checked = !!draft.soldOut;
  var body = el('div', {},
    field('f-name', 'اسم المنتج', name),
    field('f-price', 'السعر بالجنيه', price, 'سيبيه فاضي لو مش عايزة تكتبي سعر.'),
    field('f-cat', 'القسم', [cat, dl], 'زي: حلق، سلاسل، أساور. الأقسام بتظهر كأزرار فلترة فوق المنتجات.'),
    field('f-img', 'الصورة', [file, prevWrap]),
    el('div', {class: 'check'}, sold, el('label', {for: 'f-sold', text: 'خلصت من المخزون'})),
    err);
  var close;
  var save = el('button', {class: 'btn', type: 'button', text: isNew ? 'إضافة' : 'حفظ', onclick: function(){
    var n = name.value.trim();
    if (!n){ err.textContent = 'اكتبي اسم المنتج الأول.'; name.focus(); return; }
    var data = {name: n, price: price.value === '' ? '' : Math.max(0, Number(price.value)), cat: cat.value.trim(), img: draft.img, soldOut: sold.checked, sample: false};
    if (isNew){ data.id = uid(); state.products.unshift(data); }
    else Object.assign(p, data);
    touch(); statusMsg = ''; close(); render();
  }});
  var cancel = el('button', {class: 'btn ghost', type: 'button', text: 'إلغاء', onclick: function(){ close(); }});
  close = openSheet(isNew ? 'منتج جديد' : 'تعديل المنتج', body, [save, cancel]);
}
function settingsForm(){
  var s = state.settings;
  var err = el('p', {class: 'err', role: 'alert'});
  var wa = el('input', {type: 'tel', id: 's-wa', inputmode: 'tel', value: s.whatsapp ? '+' + s.whatsapp : '', dir: 'ltr', autocomplete: 'off'});
  var tg = el('input', {type: 'text', id: 's-tag', value: s.tagline, autocomplete: 'off'});
  var ig = el('input', {type: 'text', id: 's-ig', value: s.instagram, dir: 'ltr', autocomplete: 'off'});
  var body = el('div', {},
    field('s-wa', 'رقم الواتساب للطلبات', wa, 'اكتبيه بأي شكل، زي 01012345678. الأزرار بتفتح محادثة على الرقم ده.'),
    field('s-tag', 'جملة تحت اللوجو', tg),
    field('s-ig', 'حساب إنستجرام (اختياري)', ig, 'اسم الحساب بس من غير @.'),
    err);
  var close;
  var save = el('button', {class: 'btn', type: 'button', text: 'حفظ', onclick: function(){
    var n = normNum(wa.value);
    if (wa.value.trim() && n.length < 10){ err.textContent = 'الرقم قصير. اكتبيه كامل.'; wa.focus(); return; }
    s.whatsapp = n; s.tagline = tg.value.trim(); s.instagram = ig.value.trim().replace(/^@/, '');
    touch(); statusMsg = ''; close(); render();
  }});
  close = openSheet('إعدادات المتجر', body, [save, el('button', {class: 'btn ghost', type: 'button', text: 'إلغاء', onclick: function(){ close(); }})]);
}

/* ---------- publish ---------- */
function buildDoc(){
  var json = JSON.stringify(state).split('<').join('\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  var code = document.getElementById('code').textContent;
  var css = document.getElementById('css').textContent;
  var close = '<' + '/script>';
  return PREFIX +
    '<title>SERA accessories</title>' +
    document.getElementById('fonts').outerHTML +
    '<style id="css">' + css + '</style>' +
    '<div id="app" dir="rtl" lang="ar"></div>' +
    document.getElementById('logo-tpl').outerHTML +
    '<script type="application/json" id="data">' + json + close +
    '<script id="code">' + code + close +
    SUFFIX;
}
function publish(){
  if (!api || publishing || !dirty) return;
  var html = buildDoc();
  if (html.length > 14000000){ statusMsg = 'الصور كتير وحجم الصفحة كبير. امسحي كام صورة أو صغّريها.'; render(); return; }
  publishing = true; statusMsg = 'بينشر...'; render();
  api.publish(html).then(function(){
    dirty = 0; statusMsg = 'اتنشر. الصفحة بتتحدّث.';
  }).catch(function(e){
    publishing = false;
    var c = e && e.code;
    if (c === 'conflict') statusMsg = 'فيه نسخة أحدث اتنشرت. الصفحة هتتحمّل من جديد، وبعدها كرري التعديل.';
    else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'not_declared' || c === 'capability_disabled'){ canEdit = false; editing = false; statusMsg = ''; }
    else if (c === 'too_large') statusMsg = 'الصفحة كبيرة أوي. صغّري الصور أو امسحي منتجات.';
    else if (c === 'rate_limited') statusMsg = 'استني شوية وجرّبي تاني.';
    else statusMsg = 'النشر ماتمّش. جرّبي تاني كمان شوية.';
    render();
  });
}

render();
(async function(){
  try{
    var c = window.claude;
    if (!c || !c.use) return;
    var u = await c.use('user');
    var a = await c.use('artifact');
    api = a;
    if (u && a) canEdit = await u.canEdit();
  }catch(e){}
  if (canEdit) render();
})();
})();
</script>
